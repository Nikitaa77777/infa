<main>
    <form id="contact-form" action="">
            <div class="form_item">
            <label for="topic">Тема</label><br>
                <select name="topic" id="topic">
                    <option value="1">Заказать Услугу</option>
                    <option value="2">Оставить отзыв/замечание</option>
                    <option value="3">Предожить сотрудничество</option>
                    <option value="4">Другое</option>
                </select>
            </div>
                <div class="form_item">
                    <label for="name">Имя</label><br>
                     <input name="name" id="email" type="text" placeholder="Введите ваше имя" required="Обязательное поле" type="date" type="tel">
            
                </div>
        <div class="form_item">
             <label for="name">Email</label><br>
            <input name="email" id="name" type="email" placeholder="Введите вашу электронную почту" required="Обязательное поле" type="date" type="tel">
        </div>
        <label for="message">Текст сообщения:</label><br>
        <textarea id="message" name="message" rows="10" cols="50"  placeholder="Напишите ваше сообщение здесь..." required="Обязательное поле" type="date" type="tel"></textarea><br>
        <input type="submit" value="Отправить">
          
          
    </form>
